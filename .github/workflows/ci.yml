name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: clipforge
          POSTGRES_PASSWORD: clipforge
          POSTGRES_DB: clipforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clipforge -d clipforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/ClipForge.sln
      - name: Build
        run: dotnet build backend/ClipForge.sln --no-restore -c Release
      - name: Test
        env:
          ConnectionStrings__Test: Host=localhost;Port=5432;Database=clipforge_test;Username=clipforge;Password=clipforge
          Auth__JwtSigningKey: ci-only-signing-key-with-at-least-32-characters
          Internal__ApiKey: ci-internal-key
          Storage__SigningKey: ci-storage-signing-key-with-32-chars-min
        run: dotnet test backend/ClipForge.sln --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"

  processing:
    name: Processing (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        working-directory: processing
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Lint
        working-directory: processing
        run: python -m ruff check app tests
      - name: Test
        working-directory: processing
        env:
          WHISPER_ENABLED: "false"
          FFMPEG_PATH: ffmpeg
          FFPROBE_PATH: ffprobe
        run: python -m pytest -m "not integration" -q

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Test
        working-directory: frontend
        run: pnpm test -- --run
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
        run: pnpm build
