# ClipForge — development stack with Docker.
#   cp .env.example .env && docker compose -f infra/docker-compose.yml up --build
#
# Storage defaults to the Local provider on a named volume: the worker and the browser
# transfer files through the API's signed URLs, so no shared mounts or public MinIO
# hostnames are needed. Start MinIO with `--profile s3` and switch Storage__Provider=S3
# when testing the S3 provider (see docs/SETUP_PROVIDERS.md for the public URL caveat).

name: clipforge

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: clipforge
      POSTGRES_DB: clipforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipforge -d clipforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=clipforge;Username=clipforge;Password=clipforge
      Storage__Provider: ${Storage__Provider:-Local}
      Storage__Local__RootPath: /data/storage
      Storage__S3__ServiceUrl: http://minio:9000
      Api__PublicBaseUrl: http://localhost:5080
      Api__WorkerBaseUrl: http://api:8080
      Frontend__BaseUrl: http://localhost:3000
      Cors__AllowedOrigins__0: http://localhost:3000
      Assistant__Provider: ${Assistant__Provider:-local}
      Assistant__Local__BaseUrl: http://llm:8090
    ports:
      - "5080:8080"
    volumes:
      - storage:/data/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../processing
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      CLIPFORGE_API_BASE_URL: http://api:8080
      WORKER_ENABLED: "true"
      WORKER_ID: worker-docker-1
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
      WORK_DIR: /work
      MODELS_DIR: /models
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: 8008
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_BASE_URL: http://llm:8090
    volumes:
      - work:/work
      - models:/models
    ports:
      - "8008:8008"

  # The product's own AI: llama.cpp serving a small open model (Apache-2.0) on the internal
  # network. Used by the assistant chat (API) and the worker's optional titles / re-ranking.
  llm-model:
    image: curlimages/curl:8.10.1
    entrypoint:
      - /bin/sh
      - -c
      - >
        test -s /models/llm/Qwen3-1.7B-Q4_K_M.gguf ||
        (mkdir -p /models/llm &&
         curl -fL -o /models/llm/Qwen3-1.7B-Q4_K_M.gguf.part
         https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf &&
         mv /models/llm/Qwen3-1.7B-Q4_K_M.gguf.part /models/llm/Qwen3-1.7B-Q4_K_M.gguf)
    user: "0:0"
    volumes:
      - models:/models

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b11804
    depends_on:
      llm-model:
        condition: service_completed_successfully
    command: ["-m", "/models/llm/Qwen3-1.7B-Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "8090",
              "-c", "8192", "-np", "2", "--jinja", "--no-webui"]
    volumes:
      - models:/models

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-ClipForge}
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5080
      NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-ClipForge}
    ports:
      - "3000:3000"

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${Storage__S3__AccessKey:-minioadmin}
      MINIO_ROOT_PASSWORD: ${Storage__S3__SecretKey:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${Storage__S3__AccessKey:-minioadmin} ${Storage__S3__SecretKey:-minioadmin} &&
      mc mb --ignore-existing local/${Storage__S3__Bucket:-clipforge} &&
      echo bucket ready"

volumes:
  pgdata:
  storage:
  work:
  models:
  minio:
